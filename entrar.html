<!-- Projeto Parabellum Tech - Página de Login (entrar.html) -->
<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Parabellum_tech</title>
        <link rel="stylesheet" href="css/entrar.css">
    </head>
    <body>
        <main class="container">
            <button type="button" id="voltar_btn">
            <img src="img/arrow_back.svg">
            </button>
            <div class="titulo">
                <img src="img/Shield2.svg" alt="Escudo Parabellum Tech">
                <h2>Parabellum Tech</h2>
            </div>

            <h1>Portal do Cliente - Acesso Seguro</h1>

            <section class="container_login">
                <div class="opçaoLogin">
                    <button type="button" class="entrar">
                        <span>Entrar</span>
                    </button>
                    <button type="button" class="cadastrar">
                        <span>Registrar</span>
                    </button>
                </div>

                <form class="container_informaçao">
                    <label for="email_login">Email</label>
                    <div class="email">
                        <input type="email" id="email_login" placeholder="Email" required>
                    </div>

                    <label for="senha_login">Senha</label>
                    <div class="senha">
                        <input type="password" id="senha_login" placeholder="Senha" required>
                    </div>
                </form>

                <div class="suporte_login">
                    <div class="botao_lembrar">
                        <button type="button" aria-label="Lembrar-me"></button>
                        <span>Lembrar-me</span>
                    </div>

                    <div class="botao_esqueci">
                        <button type="button">Esqueci minha senha</button>
                    </div>
                </div>

                <div class="loginBtn">
                    <button type="button">Entrar com segurança</button>
                </div>
            </section>
        </main>
    </body>
</html>
