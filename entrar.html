<!-- Projeto Parabellum Tech - Página de Login (entrar.html) -->
<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Parabellum_tech</title>
        <link rel="stylesheet" href="css/entrar.css">
    </head>
    <body>
        <main class="container">
            <a href="index.html" id="voltar_btn">
                <img src="img/arrow_back.svg">
            </a>
            <div class="titulo">
                <img src="img/Shield2.svg" alt="Escudo Parabellum Tech">
                <h1>Parabellum Tech</h1>
            </div>

            <h2>Portal do Cliente - Acesso Seguro</h2>

            <section class="container_login">
                <div class="opçaoLogin">
                    <a class="entrar">Entrar</a>
                    <a href="entrar2.html" class="registrar">Registrar</a>
                </div>

                <form class="container_informaçao">
                    <label for="email_login">Email</label>
                    <div class="email" id="email">
                        <input type="email" id="email_login" placeholder="Email" required>
                    </div>

                    <label for="senha_login">Senha</label>
                    <div class="senha" id="senha">
                        <input type="password" id="senha_login" placeholder="Senha" required>
                    </div>
                </form>

                <div class="suporte_login">
                    <div class="botao_lembrar">
                        <button type="button" id="botao_lembrar" aria-label="Lembrar-me"></button>
                        <span>Lembrar-me</span>
                    </div>

                    <div class="botao_esqueci">
                        <button type="button">Esqueci minha senha</button>
                    </div>
                </div>

                <a href="index.html" class="entrar_botao" id="registro_botao">Entrar com segurança</a>

            </section>
        </main>
        
        <script src="js/entrar.js"></script>

    </body>
</html>
