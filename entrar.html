<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parabellum_tech</title>
    <link rel="stylesheet" href="css/entrar.css">
</head>
<body>
    <div class="container">
        <div class="titulo">
            <img src="./pngs/Shield2.svg">
            <h>Parabellum Tech</h>
        </div>
        <h1>Portal do Cliente - Acesso Seguro</h1>


        <div class="container_login">
            <div class="opçaoLogin">
                <button class="entrar">
                    <h>Entrar</h>
                </button>

                <button class="cadastrar"> 
                    <h>Registrar</h>
                </button>
        </div>

        <div class="container_informação">
            <h>Email</h>
            <div class="email">
                <input type="text" placeholder="Email">
            </div>

            <h>Senha</h>
            <div class="senha">
                <input type="password" placeholder="Senha">
            </div>
        </div>

        <div class="suporte_login">
            <div class="botao_lembrar">
                <button></button>
                <h>Lembrar-me</h>
            </div>
            <div class="botao_esqueci">
                <button>Esqueci minha senha</button>
            </div>
        </div>

        <div class="loginBtn">
            <button> Entrar com segurança</button>
        </div>

</div>
</html>
</body>
