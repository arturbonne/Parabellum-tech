<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parabellum_tech</title>
    <link rel="stylesheet" href="suporte.css">
</head>
<body>
    <header>
        <div class="cabecalho">
           <div class="logo-grupo"> 
                <img src="./pngs/Icon Button.svg" alt="Logo do grupo">
                <p>Parabellum tech</p>
            </div>
            <button class="inicioBtn"
                >Início
            </button>

            <button class="dashboardBtn">
                Dashboard
            </button>
    
            <button class="suporteBtn"
                >Suporte
            </button>
    
            <button class="entrarBtn"
                >Entrar
            </button>
    
        </div>
    </header>

    <div class="container">
        <div class="escrita_topo">
            <h>Central de Suporte</h>
            <p>Estamos aqui para ajudar você 24/7</p>
        </div>

        <div class="cards_3">
                
                <div class="ad">
                    <img src="./pngs/Olho.svg">
                    <h1>Email</h1>
                    <p>suporte@parabellum.tech</p>
                    <p1>Resposta em até 4 horas</p1>
                </div>
                
                <div class="ad2">
                    <img src="./pngs/Icon Button.svg">
                    <h1>Telefone</h1>
                    <p>+55 11 9999-9999</p>
                    <p1>Seg-Sex, 9h às 18h</p1>
                </div>
                
                <div class="as">
                    <img src="./pngs/Lock.svg">
                    <h1>Chat ao Vivo</h1>
                    <p>Disponível agora</p>
                    <p1>Resposta imediata</p1>
                </div>
            
        </div>
        
    </div>
</body>
