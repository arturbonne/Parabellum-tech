<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parabellum_tech</title>
    <link rel="stylesheet" href="entrar.css">
</head>
<body>
    <div class="container">
        <div class="titulo">
            <img src="./pngs/Shield2.svg">
            <h>Parabellum Tech</h>
        </div>

        <h1>Portal do Cliente - Acesso Seguro</h1>

        <div class="container_login">
            <div class="opçaoLogin">
                <button class="entrar">
                    <h>Entrar</h>
                </button>

                <button class="cadastrar"> 
                    <h>Registrar</h>
                </button>
        </div>

        <div class="container_registro">
            <h>Nome Completo</h>
            <div class="nmcp">
                <img src="./pngs/Check circle.svg">
                <input type="text" placeholder="Nome Completo">
            </div>

                <h>Email Corporativo</h>
                <div class="email_corporativo">
                    <img src="./pngs/File.svg">
                    <input type="text" placeholder="Email Corporativo">
                </div>

                    <h>Telefone Corporativo</h>
                    <div class="telefone">
                        <img src="./pngs/phone.svg">
                        <input type="password" placeholder="419999999-67">
                    </div>

                <h>Empresa</h>
                <div class="empresa">
                    <img src="./pngs/Trending up.svg">
                    <input type="text" placeholder="Nome da empresa">
                </div>
                
                <h>Senha</h>
                <div class="senha">
                    <img src="./pngs/Lock.svg">
                    <input type="password" placeholder="Senha">
                </div>

                <h>Confirmar Senha</h>
                <div class="senha">
                    <img src="./pngs/Lock.svg">
                    <input type="password" placeholder="Confirmar Senha">
                </div>  

        <div class="botao_ termos">
            <button class="termos"></button>
            <h>Concordo com os Termos de Uso e Política de Privacidade</h>
        </div>

        <button class="loginBtn">
            <h>Entrar com segurança</h>
        </button>

        </div>

</div>        
</body>
