<!-- Projeto Parabellum Tech - Página de Registro (entrar2.html) -->
<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Parabellum_tech</title>
        <link rel="stylesheet" href="css/entrar.css">
    </head>
    <body>
        <main class="container">
            <a href="index.html" id="voltar_btn">
                <img src="img/arrow_back.svg">
            </a>

            <div class="titulo">
                <img src="img/Shield2.svg" alt="Escudo Parabellum Tech">
                <h1>Parabellum Tech</h1>
            </div>

            <h2>Portal do Cliente - Acesso Seguro</h2>

            <section class="container_login">
                <div class="opçaoLogin">
                    <a href="entrar.html" class="entrar">Entrar</a>
                    <a class="registrar">Registrar</a>
                </div>

                <form class="container_registro">
                    <label for="nome_completo">Nome Completo</label>
                    <div class="nmcp">
                        <input type="text" id="nome_completo" placeholder="Nome Completo" required>
                    </div>

                    <label for="email_corporativo">Email Corporativo</label>
                    <div class="email_corporativo">
                        <input type="email" id="email_corporativo" placeholder="Email Corporativo" required>
                    </div>

                    <label for="telefone_corporativo">Telefone Corporativo</label>
                    <div class="telefone">
                        <input type="tel" id="telefone_corporativo" placeholder="419999999-67" required>
                    </div>

                    <label for="nome_empresa">Empresa</label>
                    <div class="empresa">
                        <input type="text" id="nome_empresa" placeholder="Nome da empresa" required>
                    </div>

                    <label for="senha_registro">Senha</label>
                    <div class="senha">
                        <input type="password" id="senha_registro" placeholder="Senha" required>
                    </div>

                    <label for="confirmar_senha">Confirmar Senha</label>
                    <div class="senha">
                        <input type="password" id="confirmar_senha" placeholder="Confirmar Senha" required>
                    </div>

                    <div class="botao_termos">
                        <button type="button" class="termos" id="botao_lembrar" aria-label="Aceitar termos"></button>
                        <span>Concordo com os Termos de Uso e Política de Privacidade</span>
                    </div>

                    <a href="index.html" class="entrar_botao" id="registro_botao">Entrar com segurança</a>
                </form>
            </section>
        </main>
        
        <script src="js/entrar.js"></script>
    </body>
</html>
